apiVersion: v1
kind: Namespace
metadata:
  name: hadmc
  labels:
    app.kubernetes.io/part-of: had-mc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hadmc-studio
  namespace: hadmc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hadmc-studio
  namespace: hadmc
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hadmc-studio
  namespace: hadmc
subjects:
  - kind: ServiceAccount
    name: hadmc-studio
    namespace: hadmc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hadmc-studio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hadmc-studio
  namespace: hadmc
  labels:
    app.kubernetes.io/name: had-mc
    app.kubernetes.io/component: studio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: had-mc
      app.kubernetes.io/component: studio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: had-mc
        app.kubernetes.io/component: studio
    spec:
      serviceAccountName: hadmc-studio
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: gpu-02
      containers:
        - name: studio
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/server.py"]
          env:
            - name: HADMC_ROOT
              value: /data/hadmc
            - name: HADMC_NAMESPACE
              value: hadmc
            - name: HADMC_LISTEN_HOST
              value: 0.0.0.0
            - name: HADMC_LISTEN_PORT
              value: "18888"
            - name: HADMC_JOB_IMAGE
              value: 10.8.144.65/platform/llama-factory-trainer-dcu:v1.17-isolated-compat
          ports:
            - name: http
              containerPort: 18888
              hostPort: 18888
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: studio-code
              mountPath: /app
              readOnly: true
            - name: artifacts
              mountPath: /data/hadmc/artifacts
      volumes:
        - name: studio-code
          configMap:
            name: hadmc-studio-code
            items:
              - key: server.py
                path: server.py
              - key: index.html
                path: static/index.html
              - key: three.min.js
                path: static/vendor/three.min.js
        - name: artifacts
          hostPath:
            path: /data/hadmc/artifacts
            type: Directory
